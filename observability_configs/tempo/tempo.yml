server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

live_store:
  max_trace_idle: 10s
  max_block_duration: 5m

backend_scheduler:
  provider:
    compaction:
      compaction:
        compaction_window: 1h
        max_block_bytes: 100000000
        block_retention: 24h
        compacted_block_retention: 10m

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo