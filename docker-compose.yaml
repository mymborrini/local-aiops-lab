services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 1h
      timeout: 3s
      retries: 3
      start_period: 10s

  outbox_processor:
    build:
      context: .
      dockerfile: Dockerfile.outbox-processor
    ports:
     - 8001
    depends_on:
      app:
        condition: service_healthy
    container_name: outbox_processor

  job_processor:
    build:
      context: .
      dockerfile: Dockerfile.job-processor
    ports:
     - 8001
    depends_on:
      app:
        condition: service_healthy
    container_name: job_processor

  redis:
    image: redis:8-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      app:
        condition: service_healthy

volumes:
  prometheus_data:
  