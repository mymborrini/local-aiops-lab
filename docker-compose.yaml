services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    container_name: app
    environment:
      LOKI_URL: http://loki:3100
      SERVICE_NAME: app
      OTEL_SERVICE_NAME: app
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 1h
      timeout: 3s
      retries: 3
      start_period: 10s

  outbox_processor:
    build:
      context: .
      dockerfile: Dockerfile.outbox-processor
    ports:
     - 8001
    environment:
      LOKI_URL: http://loki:3100
      SERVICE_NAME: outbox_processor
    depends_on:
      app:
        condition: service_healthy
    container_name: outbox_processor

  job_processor:
    build:
      context: .
      dockerfile: Dockerfile.job-processor
    ports:
     - 8001
    environment:
      LOKI_URL: http://loki:3100
      SERVICE_NAME: job_processor
    depends_on:
      app:
        condition: service_healthy
    container_name: job_processor

  redis:
    image: redis:8-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    ports:
      - 9090
    volumes:
      - ./observability_configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      app:
        condition: service_healthy
  
  loki:
    image: grafana/loki:3.7.0
    ports:
      - 3100
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./observability_configs/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    container_name: loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tempo:
    image: grafana/tempo:3.1.0
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    container_name: tempo
    ports:
      - 3200
      - 4318
    volumes:
      - ./observability_configs/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    healthcheck:
      test: ["CMD", "/tempo", "--health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:9.0.0
    container_name: grafana
    ports:
      - 3000
    volumes:
      - ./observability_configs/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
  