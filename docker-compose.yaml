services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: app

  job-processor:
    build:
      context: .
      dockerfile: Dockerfile.job-processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: job-processor
  
  outbox-processor:
    build:
      context: .
      dockerfile: Dockerfile.outbox-processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: outbox-processor

  redis:
    image: redis:8-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

        